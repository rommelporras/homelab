# Grafana Dashboard - Node Disk Usage Tripwire
# Per-directory disk usage (containerd, longhorn, log) on each of the 3 k8s
# nodes, sourced from node_directory_size_bytes (node-exporter textfile
# collector, written by scripts/node/disk-usage-textfile.sh via a systemd
# timer every 2 minutes - see docs/context/Storage.md "Node-level disk usage
# tripwire").
#
# Why this exists: the 2026-09-08 disk-fill incident's forensic
# reconstruction was inconclusive because node_filesystem_avail_bytes (the
# default node-exporter metric) only gives root-filesystem totals, not a
# per-directory breakdown, and only at 60s resolution. This dashboard is
# where that gap gets watched going forward - the Growth Trend row is the
# panel that would have caught the incident's ~180GiB/25min drain in
# progress, which no existing dashboard could show.
#
# Auto-provisioned via grafana_dashboard label
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-disk-usage-dashboard
  namespace: monitoring
  annotations:
    grafana_folder: "Homelab"
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus-stack
data:
  node-disk-usage.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Disk Usage Overview",
          "description": "Current disk usage per watched directory per node. Check this first - the number to watch is whichever directory is largest or growing fastest.",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "N/A",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 107374182400 },
                  { "color": "red", "value": 214748364800 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "title": "cp1 (10.10.30.11)",
          "description": "containerd, longhorn, and log directory sizes on k8s-cp1. Thresholds: yellow at 100GiB, red at 200GiB per directory - adjust if a directory's normal size legitimately exceeds this (e.g. Longhorn grows with real workload data).",
          "type": "stat",
          "targets": [
            {
              "expr": "node_directory_size_bytes{instance=\"10.10.30.11:9100\"}",
              "legendFormat": "{{directory}}",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "N/A",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 107374182400 },
                  { "color": "red", "value": 214748364800 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 1 },
          "id": 3,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "title": "cp2 (10.10.30.12)",
          "description": "containerd, longhorn, and log directory sizes on k8s-cp2. Same thresholds as cp1.",
          "type": "stat",
          "targets": [
            {
              "expr": "node_directory_size_bytes{instance=\"10.10.30.12:9100\"}",
              "legendFormat": "{{directory}}",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "N/A",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 107374182400 },
                  { "color": "red", "value": 214748364800 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 1 },
          "id": 4,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "title": "cp3 (10.10.30.13)",
          "description": "containerd, longhorn, and log directory sizes on k8s-cp3. Same thresholds as cp1.",
          "type": "stat",
          "targets": [
            {
              "expr": "node_directory_size_bytes{instance=\"10.10.30.13:9100\"}",
              "legendFormat": "{{directory}}",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "id": 10,
          "title": "Growth Trend",
          "description": "Bytes over time per directory per node. This is the panel that would have caught the 2026-09-08 incident's ~180GiB/25min drain in progress - a steep, sustained slope here is the signal to investigate immediately, not wait for a root-filesystem-percent alert to fire.",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 11,
          "options": {
            "legend": { "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Directory Size Over Time (all nodes)",
          "description": "node_directory_size_bytes for containerd/longhorn/log across all 3 nodes. Look for slope, not just absolute level - a directory that's large but flat is fine; one climbing fast is the thing to investigate.",
          "type": "timeseries",
          "targets": [
            {
              "expr": "node_directory_size_bytes",
              "legendFormat": "{{instance}} - {{directory}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "id": 12,
          "options": {
            "legend": { "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Growth Rate (bytes/sec, 15m rate)",
          "description": "Rate of change of directory size. Near-zero = stable. A sustained positive spike here is the earliest possible signal of a drain in progress - this is what the 2026-09-08 incident never had visibility into.",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(node_directory_size_bytes[15m])",
              "legendFormat": "{{instance}} - {{directory}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "storage",
        "infrastructure",
        "nodes"
      ],
      "templating": {
        "list": []
      },
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "Asia/Manila",
      "title": "Node Disk Usage Tripwire",
      "uid": "node-disk-usage"
    }
